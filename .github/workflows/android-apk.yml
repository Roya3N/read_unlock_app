name: Android APK

# Builds an installable test APK. Download it from the run's "Artifacts".
# It is signed with the debug key, so it is for testing, not the Play Store.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: smart-unlock-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
