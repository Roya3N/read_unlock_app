name: read_unlock_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:

  flutter:
    sdk: flutter
    
  flutter_tts: ^4.2.5  

  # 🔊 Audio
  audioplayers: ^6.6.0

  # 🎉 Confetti
  confetti: ^0.8.0

  # 💾 Storage
  shared_preferences: ^2.5.5

  # 🍎 Icons
  cupertino_icons: ^1.0.8

  # ✨ Animations
  flutter_animate: ^4.5.2
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  intl: ^0.20.2
  file_picker: ^11.0.2
  signature: ^6.3.0
  image_picker: ^1.2.1
  syncfusion_flutter_pdfviewer: ^33.1.49
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  http_certificate_pinning: ^3.0.1
  cached_network_image: ^3.4.1
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  crypto: ^3.0.7
  share_plus: ^12.0.2
  supabase_flutter: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/avatars/
    - assets/books/tortoise/
    - assets/books/lion/
    - assets/images/
    - assets/images/Magic_Tracing/
    - assets/sounds/ElevenLabs/

